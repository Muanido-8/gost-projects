[project]
name = "ghost-projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muanido's", email = "faceandsub@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pathspec>=1.1.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyside6>=6.12.0",
]

[project.scripts]
ghost-projects = "ghost_projects:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
